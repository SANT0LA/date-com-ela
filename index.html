<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Date Amanhã com João</title>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Chewy', cursive;
      background: #fff;
      overflow: hidden;
    }

    #app {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 16px;
    }

    .screen {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      position: relative;
      padding: 16px;
    }
    .screen.active { display: flex; }

    .brand {
      position: fixed;
      bottom: 12px;
      right: 16px;
      font-family: 'Chewy', cursive;
      font-size: clamp(14px, 3.5vw, 18px);
      color: #111;
      font-style: italic;
      z-index: 9000;
      pointer-events: none;
      text-shadow: 0 1px 4px rgba(255,255,255,0.9);
    }

    /* ---- TELAS 1 e 2 ---- */
    .question {
      font-family: 'Chewy', cursive;
      font-size: clamp(28px, 6vw, 52px);
      color: #111;
      text-align: center;
      line-height: 1.2;
      margin-bottom: clamp(32px, 6vh, 60px);
      max-width: 700px;
      padding: 0 8px;
    }

    .buttons-row {
      display: flex;
      gap: clamp(16px, 4vw, 40px);
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 700px;
      flex-wrap: wrap;
    }

    .btn-yes {
      background: #1DB954;
      color: #111;
      border: none;
      border-radius: 50px;
      font-family: 'Chewy', cursive;
      font-size: clamp(20px, 4vw, 26px);
      padding: clamp(16px, 3vw, 24px) clamp(36px, 6vw, 70px);
      cursor: pointer;
      letter-spacing: 1px;
      transition: transform 0.1s;
      flex-shrink: 0;
      min-width: clamp(140px, 35vw, 220px);
    }
    .btn-yes:hover { transform: scale(1.05); }
    .btn-yes:active { transform: scale(0.97); }

    .btn-no {
      background: #FF4C3B;
      color: #111;
      border: none;
      border-radius: 50px;
      font-family: 'Chewy', cursive;
      font-size: clamp(20px, 4vw, 26px);
      padding: clamp(16px, 3vw, 24px) clamp(36px, 6vw, 70px);
      cursor: pointer;
      flex-shrink: 0;
      min-width: clamp(140px, 35vw, 220px);
    }

    .btn-no-runaway {
      position: fixed;
      z-index: 999;
      transition: left 0.18s ease, top 0.18s ease;
    }

    /* ---- TELA 3: ROLETA ---- */
    .wheel-title {
      font-family: 'Chewy', cursive;
      font-size: clamp(22px, 5vw, 34px);
      color: #111;
      text-align: center;
      margin-bottom: 16px;
    }

    .wheel-layout {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(16px, 4vw, 40px);
      flex-wrap: wrap;
      width: 100%;
    }

    .wheel-container {
      position: relative;
      width: clamp(180px, 40vw, 260px);
      height: clamp(180px, 40vw, 260px);
      flex-shrink: 0;
    }

    #wheelCanvas {
      width: 100%;
      height: 100%;
    }

    .pin {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 20px solid #1a5276;
      z-index: 10;
    }

    .wheel-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 28px;
      height: 28px;
      background: #f5f5dc;
      border-radius: 50%;
      border: 3px solid #aaa;
      z-index: 5;
    }

    .wheel-btns {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .btn-select {
      background: #1DB954;
      color: #111;
      border: none;
      border-radius: 40px;
      font-family: 'Chewy', cursive;
      font-size: clamp(16px, 3.5vw, 22px);
      padding: clamp(12px, 2.5vw, 18px) clamp(24px, 5vw, 40px);
      cursor: pointer;
      transition: transform 0.1s;
      min-width: clamp(140px, 38vw, 200px);
      text-align: center;
    }
    .btn-select:hover { transform: scale(1.04); }

    .btn-teal {
      background: #17A589;
      color: #fff;
      border: none;
      border-radius: 40px;
      font-family: 'Chewy', cursive;
      font-size: clamp(15px, 3vw, 20px);
      padding: clamp(10px, 2vw, 16px) clamp(20px, 4vw, 32px);
      cursor: pointer;
      transition: transform 0.1s;
      min-width: clamp(140px, 38vw, 200px);
      text-align: center;
    }
    .btn-teal:hover { transform: scale(1.04); }

    .result-label {
      font-family: 'Chewy', cursive;
      font-size: clamp(15px, 3.5vw, 20px);
      color: #E8821B;
      text-align: center;
      margin-top: 10px;
      min-height: 26px;
    }

    .manual-picker {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }
    .manual-picker.show { display: flex; }
    .manual-picker select {
      font-family: 'Chewy', cursive;
      font-size: clamp(14px, 3vw, 18px);
      padding: 8px 18px;
      border-radius: 30px;
      border: 2px solid #17A589;
      outline: none;
      color: #111;
      max-width: 90vw;
    }
    .manual-picker button {
      background: #17A589;
      color: #fff;
      border: none;
      border-radius: 30px;
      font-family: 'Chewy', cursive;
      font-size: clamp(14px, 3vw, 18px);
      padding: 10px 30px;
      cursor: pointer;
    }

    /* ---- TELA 4 ---- */
    .confirm-text {
      font-family: 'Chewy', cursive;
      font-size: clamp(22px, 5.5vw, 42px);
      color: #111;
      text-align: center;
      line-height: 1.4;
      max-width: 90vw;
      position: relative;
      z-index: 2;
    }

    /* Figurinhas flutuantes — cantos da tela 4 */
    .sticker-item {
      position: absolute;
      width: clamp(70px, 14vw, 120px);
      height: auto;
      animation: floatEmoji 3s ease-in-out infinite;
      pointer-events: none;
      z-index: 1;
    }

    /* Emojis flutuantes — cantos */
    .emoji-item {
      position: absolute;
      font-size: clamp(28px, 6vw, 52px);
      animation: floatEmoji 3s ease-in-out infinite;
      pointer-events: none;
      z-index: 1;
    }
    @keyframes floatEmoji {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%       { transform: translateY(-10px) rotate(5deg); }
    }

    /* Chuva de emojis ao entrar na tela 4 */
    .emoji-rain {
      position: fixed;
      top: -60px;
      font-size: clamp(22px, 4vw, 36px);
      animation: rainFall linear forwards;
      pointer-events: none;
      z-index: 0;
    }
    @keyframes rainFall {
      0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0.3; }
    }

    /* Botão reiniciar */
    .btn-restart {
      position: absolute;
      bottom: 14px;
      left: 16px;
      background: #eee;
      color: #555;
      border: none;
      border-radius: 30px;
      font-family: 'Chewy', cursive;
      font-size: clamp(13px, 2.5vw, 16px);
      padding: 8px 20px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      z-index: 10;
    }
    .btn-restart:hover { background: #ddd; transform: scale(1.04); }
    .btn-restart:active { transform: scale(0.97); }

    /* Partículas de explosão */
    .particle {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      border-radius: 50%;
      animation: explodePop var(--dur, 0.9s) ease-out forwards;
    }
    @keyframes explodePop {
      0%   { transform: scale(1) translate(0,0) rotate(0deg); opacity: 1; }
      60%  { opacity: 1; }
      100% { transform: scale(0.2) translate(var(--tx), var(--ty)) rotate(var(--rot)); opacity: 0; }
    }

    /* Confetes retangulares */
    .confetti {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      animation: confettiFly var(--dur, 1.1s) ease-out forwards;
      border-radius: 2px;
    }
    @keyframes confettiFly {
      0%   { transform: translate(0,0) rotate(0deg) scaleY(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scaleY(0.3); opacity: 0; }
    }

    /* Flash de tela */
    .explosion-flash {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at var(--cx) var(--cy), #fff 0%, rgba(255,200,0,0.6) 30%, transparent 70%);
      pointer-events: none;
      z-index: 9998;
      animation: flashOut 0.4s ease-out forwards;
    }
    @keyframes flashOut {
      0%   { opacity: 1; }
      100% { opacity: 0; }
    }

    /* Texto BOOM */
    .boom-text {
      position: fixed;
      font-family: 'Chewy', cursive;
      font-size: clamp(48px, 14vw, 100px);
      color: #FF4C3B;
      text-shadow: 3px 3px 0 #FFD700, 6px 6px 0 #FF8C00;
      pointer-events: none;
      z-index: 10000;
      transform: translate(-50%, -50%) scale(0);
      animation: boomPop 0.6s cubic-bezier(0.17, 0.67, 0.12, 1.4) forwards;
    }
    @keyframes boomPop {
      0%   { transform: translate(-50%, -50%) scale(0) rotate(-10deg); opacity: 1; }
      60%  { transform: translate(-50%, -50%) scale(1.3) rotate(5deg);  opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(0.8) rotate(-3deg); opacity: 0; }
    }

    /* Ondas de choque */
    .shockwave {
      position: fixed;
      border-radius: 50%;
      border: 4px solid rgba(255, 150, 0, 0.8);
      pointer-events: none;
      z-index: 9997;
      transform: translate(-50%, -50%) scale(0);
      animation: shockExpand var(--dur, 0.7s) ease-out forwards;
    }
    @keyframes shockExpand {
      0%   { transform: translate(-50%, -50%) scale(0);   opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(4);   opacity: 0; }
    }

    /* Mobile: tela 3 empilhada */
    @media (max-width: 520px) {
      .wheel-layout { flex-direction: column; gap: 12px; }
      .wheel-btns { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 10px; }
      .btn-teal, .btn-select { min-width: 130px; }
      #screen3 { justify-content: flex-start; padding-top: clamp(20px, 5vh, 40px); overflow-y: auto; }
    }
  </style>
</head>
<body>
<!-- Marca fixa, sempre visível em qualquer tela e em qualquer device -->
<span class="brand">Santola Corp.</span>

<div id="app">

  <!-- ===================== TELA 1 ===================== -->
  <div id="screen1" class="screen active">
    <p class="question">Você vai para o date amanhã (15/05) com João?🤔</p>
    <div class="buttons-row">
      <button class="btn-yes" onclick="goToScreen2()">CLARO!</button>
      <button class="btn-no" id="btnNo1" onmouseenter="runAway()" onclick="runAway()">Não.</button>
    </div>
  </div>

  <!-- ===================== TELA 2 ===================== -->
  <div id="screen2" class="screen">
    <p class="question" style="font-size:clamp(32px,7vw,60px)">Está empolgada?🤩</p>
    <div class="buttons-row">
      <button class="btn-yes" onclick="goToScreen3()">MUITO!</button>
      <button class="btn-no" id="btnNo2" onclick="explodeBtn(this)">Não.</button>
    </div>
  </div>

  <!-- ===================== TELA 3: ROLETA ===================== -->
  <div id="screen3" class="screen">
    <p class="wheel-title">Escolher local:</p>
    <div class="wheel-layout">
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
        <div class="wheel-container">
          <div class="pin"></div>
          <canvas id="wheelCanvas" width="260" height="260"></canvas>
          <div class="wheel-center"></div>
        </div>
        <div class="result-label" id="resultLabel">— gire a roleta! —</div>
        <button class="btn-select" id="btnSelectar" onclick="selectRestaurant()"
          style="opacity:0.4;cursor:not-allowed;margin-top:6px">Selecionar</button>
      </div>
      <div class="wheel-btns">
        <button class="btn-teal" onclick="spinWheel()">Roletar novamente</button>
        <button class="btn-teal" onclick="toggleManual()">Escolher na mão</button>
        <div class="manual-picker" id="manualPicker">
          <select id="manualSelect"></select>
          <button onclick="chooseManual()">Confirmar</button>
        </div>
      </div>
    </div>
    <span class="brand">Santola Corp.</span>
  </div>

  <!-- ===================== TELA 4 ===================== -->

<script>
  /* ============================================================
     CONFIGURAÇÕES — edite aqui facilmente
  ============================================================ */
  const NOME    = "Teté";
  const HORARIO = "19 horas";
  const restaurants = [
    "Azougue","Al Mare","Purgatorio","Lotti","Cantina Volpi",
    "33 Contemporâneo","Ori","Casa Iryna","Amado","Gattai","Alfredo'Ro"
  ];

  /* ============================================================
     ROLETA
  ============================================================ */
  const colors = [
    "#F4A340","#3CB371","#1E90FF","#9B59B6","#E74C3C",
    "#27AE60","#F39C12","#2ECC71","#E67E22","#16A085","#8E44AD"
  ];

  let currentRestaurant = null;
  let isSpinning        = false;
  let currentAngle      = 0;
  let audioContext      = null;

  function getAudioContext() {
    if (!audioContext) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioContext;
  }

  function playSfx(type = 'click') {
    const ctx = getAudioContext();
    if (ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);

    if (type === 'boom') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(120, now);
      osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    } else if (type === 'spin') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(220, now + 0.18);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    } else if (type === 'success') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(640, now);
      osc.frequency.exponentialRampToValueAtTime(900, now + 0.12);
      gain.gain.setValueAtTime(0.16, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
    } else if (type === 'yay') {
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(900, now);
      filter.Q.setValueAtTime(7, now);

      osc.connect(gain);
      gain.connect(filter);
      osc2.connect(gain2);
      gain2.connect(filter);
      filter.connect(ctx.destination);

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(520, now);
      osc.frequency.exponentialRampToValueAtTime(980, now + 0.32);
      gain.gain.setValueAtTime(0.16, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

      osc2.type = 'sawtooth';
      osc2.frequency.setValueAtTime(760, now);
      osc2.frequency.exponentialRampToValueAtTime(1120, now + 0.32);
      gain2.gain.setValueAtTime(0.08, now);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

      osc.start(now);
      osc2.start(now);
      osc.stop(now + 0.4);
      osc2.stop(now + 0.4);
      return;
    } else {
      osc.type = 'square';
      osc.frequency.setValueAtTime(520, now);
      gain.gain.setValueAtTime(0.14, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
    }

    osc.start(now);
    osc.stop(now + 0.25);
  }

  function getWheelSize() {
    const container = document.querySelector('.wheel-container');
    return container ? container.offsetWidth : 260;
  }

  function drawWheel(angle) {
    const canvas = document.getElementById('wheelCanvas');
    if (!canvas) return;
    const size = canvas.offsetWidth || 260;
    canvas.width  = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    const cx = size / 2, cy = size / 2, r = size / 2 - 4;
    const n = restaurants.length;
    const slice = (2 * Math.PI) / n;
    ctx.clearRect(0, 0, size, size);

    for (let i = 0; i < n; i++) {
      const start = angle + i * slice;
      const end   = start + slice;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, start, end);
      ctx.closePath();
      ctx.fillStyle   = colors[i % colors.length];
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth   = 1.5;
      ctx.stroke();

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(start + slice / 2);
      ctx.textAlign  = 'right';
      ctx.fillStyle  = '#fff';
      const fs = Math.max(9, Math.round(size * 0.042));
      ctx.font       = `bold ${fs}px Chewy, cursive`;
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur  = 2;
      ctx.fillText(restaurants[i], r - 10, 4);
      ctx.restore();
    }

    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, 2 * Math.PI);
    ctx.strokeStyle = '#E8821B';
    ctx.lineWidth   = 6;
    ctx.stroke();

    for (let i = 0; i < n; i++) {
      const a  = angle + i * slice + slice / 2;
      const bx = cx + (r - 14) * Math.cos(a);
      const by = cy + (r - 14) * Math.sin(a);
      ctx.beginPath();
      ctx.arc(bx, by, 5, 0, 2 * Math.PI);
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fill();
    }
  }

  drawWheel(0);
  window.addEventListener('resize', () => drawWheel(currentAngle));

  const sel = document.getElementById('manualSelect');
  restaurants.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r; opt.textContent = r;
    sel.appendChild(opt);
  });

  function spinWheel() {
    playSfx('spin');
    if (isSpinning) return;
    isSpinning = true;
    document.getElementById('resultLabel').textContent = '— girando... —';
    const btnS = document.getElementById('btnSelectar');
    btnS.style.opacity = '0.4';
    btnS.style.cursor  = 'not-allowed';

    const totalRotation = (5 + Math.random() * 5) * 2 * Math.PI + Math.random() * 2 * Math.PI;
    const duration      = 4000;
    const startTime     = performance.now();
    const startAngle    = currentAngle;

    function animate(now) {
      const t    = Math.min((now - startTime) / duration, 1);
      const ease = 1 - Math.pow(1 - t, 4);
      currentAngle = startAngle + totalRotation * ease;
      drawWheel(currentAngle);
      if (t < 1) {
        requestAnimationFrame(animate);
      } else {
        isSpinning = false;
        const slice = (2 * Math.PI) / restaurants.length;
        const norm  = (((-currentAngle - Math.PI / 2) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
        const idx   = Math.floor(norm / slice) % restaurants.length;
        currentRestaurant = restaurants[idx];
        document.getElementById('resultLabel').textContent = '🍽️ ' + currentRestaurant;
        btnS.style.opacity = '1';
        btnS.style.cursor  = 'pointer';
      }
    }
    requestAnimationFrame(animate);
  }

  function selectRestaurant() { if (currentRestaurant) { playSfx('success'); showConfirm(currentRestaurant); } }
  function toggleManual()     { playSfx('click'); document.getElementById('manualPicker').classList.toggle('show'); }
  function chooseManual()     { playSfx('click'); showConfirm(document.getElementById('manualSelect').value); }

  function showConfirm(restaurant) {
    document.getElementById('chosenRestaurant').textContent = restaurant;
    goToScreen(4);
    playSfx('yay');
    launchEmojiRain();
  }

  /* ============================================================
     CHUVA DE EMOJIS — tela 4
  ============================================================ */
  const rainEmojis = ['❤️','💕','😍','🌹','✨','💫','🥰','💝','🎉','💐','😘','🫶'];
  let rainInterval = null;

  function launchEmojiRain() {
    clearInterval(rainInterval);
    // remove chuva antiga
    document.querySelectorAll('.emoji-rain').forEach(e => e.remove());

    let count = 0;
    rainInterval = setInterval(() => {
      if (count++ > 30) { clearInterval(rainInterval); return; }
      const el = document.createElement('span');
      el.className   = 'emoji-rain';
      el.textContent = rainEmojis[Math.floor(Math.random() * rainEmojis.length)];
      el.style.left  = Math.random() * 95 + 'vw';
      const dur = 2.5 + Math.random() * 2;
      el.style.animationDuration = dur + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), dur * 1000 + 200);
    }, 120);
  }

  /* ============================================================
     NAVEGAÇÃO
  ============================================================ */
  function goToScreen(n) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen' + n).classList.add('active');
  }

  function goToScreen3() { playSfx('click'); goToScreen(3); }

  function restartApp() {
    playSfx('click');
    clearInterval(rainInterval);
    document.querySelectorAll('.emoji-rain').forEach(e => e.remove());
    currentRestaurant = null;
    isSpinning        = false;
    currentAngle      = 0;
    drawWheel(0);
    document.getElementById('resultLabel').textContent = '— gire a roleta! —';
    const btnS = document.getElementById('btnSelectar');
    btnS.style.opacity = '0.4';
    btnS.style.cursor  = 'not-allowed';
    document.getElementById('manualPicker').classList.remove('show');
    // Recriar btnNo2 se foi explodido
    const row2 = document.querySelector('#screen2 .buttons-row');
    if (!document.getElementById('btnNo2')) {
      const nb = document.createElement('button');
      nb.className = 'btn-no';
      nb.id        = 'btnNo2';
      nb.textContent = 'Não.';
      nb.onclick   = function() { explodeBtn(this); };
      row2.appendChild(nb);
    }
    cleanRunaway();
    goToScreen(1);
  }

  /* ============================================================
     BOTÃO FUGINDO — tela 1
  ============================================================ */
  let runawayBtn = null;

  function initRunawayBtn() {
    if (runawayBtn) return;
    const original = document.getElementById('btnNo1');
    const rect     = original.getBoundingClientRect();
    runawayBtn     = document.createElement('button');
    runawayBtn.className   = 'btn-no btn-no-runaway';
    runawayBtn.textContent = 'Não.';
    runawayBtn.style.left   = rect.left + 'px';
    runawayBtn.style.top    = rect.top  + 'px';
    runawayBtn.style.width  = rect.width + 'px';
    runawayBtn.style.height = rect.height + 'px';
    runawayBtn.addEventListener('mouseenter', runAway);
    runawayBtn.addEventListener('touchstart', runAway, { passive: true });
    runawayBtn.addEventListener('click', runAway);
    document.body.appendChild(runawayBtn);
    original.style.visibility = 'hidden';
  }

  function runAway() {
    playSfx('click');
    initRunawayBtn();
    const bw = runawayBtn.offsetWidth;
    const bh = runawayBtn.offsetHeight;
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    runawayBtn.style.left = (Math.random() * (vw - bw - 10) + 5) + 'px';
    runawayBtn.style.top  = (Math.random() * (vh - bh - 10) + 5) + 'px';
  }

  function cleanRunaway() {
    if (runawayBtn) { runawayBtn.remove(); runawayBtn = null; }
    const original = document.getElementById('btnNo1');
    if (original) original.style.visibility = 'visible';
  }

  function goToScreen2() { playSfx('click'); cleanRunaway(); goToScreen(2); }

  /* ============================================================
     BOTÃO EXPLODINDO — tela 2 (versão espalhafatosa)
  ============================================================ */
  function explodeBtn(btn) {
    const rect = btn.getBoundingClientRect();
    const cx   = rect.left + rect.width  / 2;
    const cy   = rect.top  + rect.height / 2;
    const cxPct = (cx / window.innerWidth  * 100).toFixed(1) + '%';
    const cyPct = (cy / window.innerHeight * 100).toFixed(1) + '%';
    const palette = ['#FF4C3B','#FF8C00','#FFD700','#FF69B4','#FF1493','#FFA500','#fff'];

    playSfx('boom');
    // 1) Flash de tela
    const flash = document.createElement('div');
    flash.className = 'explosion-flash';
    flash.style.setProperty('--cx', cxPct);
    flash.style.setProperty('--cy', cyPct);
    document.body.appendChild(flash);
    setTimeout(() => flash.remove(), 500);

    // 2) Ondas de choque (3 anéis com delay)
    [0, 120, 240].forEach((delay, i) => {
      setTimeout(() => {
        const sw = document.createElement('div');
        sw.className = 'shockwave';
        sw.style.cssText = `left:${cx}px;top:${cy}px;width:${60+i*20}px;height:${60+i*20}px;--dur:${0.7+i*0.15}s;`;
        document.body.appendChild(sw);
        setTimeout(() => sw.remove(), 1000);
      }, delay);
    });

    // 3) Texto BOOM
    const boom = document.createElement('div');
    boom.className   = 'boom-text';
    boom.textContent = ['💥 BOOM!','🔥 NAO!','💣 BYE!'][Math.floor(Math.random()*3)];
    boom.style.cssText = `left:${cx}px;top:${cy - 60}px;`;
    document.body.appendChild(boom);
    setTimeout(() => boom.remove(), 800);

    // 4) Partículas circulares — muitas, espalhadas por toda a tela
    const PARTICLES = 60;
    for (let i = 0; i < PARTICLES; i++) {
      setTimeout(() => {
        const p   = document.createElement('div');
        p.className = 'particle';
        const angle = Math.random() * 360;
        const dist  = 80 + Math.random() * Math.max(window.innerWidth, window.innerHeight) * 0.55;
        const size  = 8 + Math.random() * 18;
        const dur   = 0.7 + Math.random() * 0.7;
        const tx    = Math.cos(angle * Math.PI / 180) * dist + 'px';
        const ty    = Math.sin(angle * Math.PI / 180) * dist + 'px';
        const rot   = (Math.random() - 0.5) * 720 + 'deg';
        const color = palette[Math.floor(Math.random() * palette.length)];
        p.style.cssText = `left:${cx}px;top:${cy}px;width:${size}px;height:${size}px;background:${color};--tx:${tx};--ty:${ty};--dur:${dur}s;--rot:${rot};`;
        document.body.appendChild(p);
        setTimeout(() => p.remove(), dur * 1000 + 100);
      }, i * 12);
    }

    // 5) Confetes retangulares coloridos
    const CONFETTI = 40;
    for (let i = 0; i < CONFETTI; i++) {
      setTimeout(() => {
        const c   = document.createElement('div');
        c.className = 'confetti';
        const angle = Math.random() * 360;
        const dist  = 60 + Math.random() * window.innerWidth * 0.5;
        const w     = 6 + Math.random() * 10;
        const h     = 12 + Math.random() * 18;
        const dur   = 0.9 + Math.random() * 0.6;
        const tx    = Math.cos(angle * Math.PI / 180) * dist + 'px';
        const ty    = Math.sin(angle * Math.PI / 180) * dist + 'px';
        const rot   = (Math.random() - 0.5) * 900 + 'deg';
        const color = palette[Math.floor(Math.random() * palette.length)];
        c.style.cssText = `left:${cx}px;top:${cy}px;width:${w}px;height:${h}px;background:${color};--tx:${tx};--ty:${ty};--dur:${dur}s;--rot:${rot};`;
        document.body.appendChild(c);
        setTimeout(() => c.remove(), dur * 1000 + 100);
      }, i * 15);
    }

    // 6) Emojis voando para todo lado
    const EMOJIS = ['💥','🔥','⚡','✨','🌟','💫','🎆','🎇'];
    for (let i = 0; i < 12; i++) {
      setTimeout(() => {
        const e   = document.createElement('div');
        e.className = 'particle';
        e.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
        e.style.background = 'transparent';
        e.style.fontSize   = clamp(20, 36) + 'px';
        e.style.borderRadius = '0';
        const angle = Math.random() * 360;
        const dist  = 100 + Math.random() * window.innerWidth * 0.4;
        const dur   = 0.8 + Math.random() * 0.5;
        const tx    = Math.cos(angle * Math.PI / 180) * dist + 'px';
        const ty    = Math.sin(angle * Math.PI / 180) * dist + 'px';
        e.style.cssText += `left:${cx}px;top:${cy}px;--tx:${tx};--ty:${ty};--dur:${dur}s;--rot:${(Math.random()-0.5)*360}deg;`;
        document.body.appendChild(e);
        setTimeout(() => e.remove(), dur * 1000 + 100);
      }, i * 30);
    }

    // 7) Botão some com animação dramática
    btn.style.transition = 'transform 0.25s cubic-bezier(0.17,0.67,0.12,1.4), opacity 0.25s';
    btn.style.transform  = 'scale(3) rotate(20deg)';
    btn.style.opacity    = '0';
    setTimeout(() => btn.remove(), 300);
  }

  function clamp(min, max) { return min + Math.random() * (max - min); }
</script>
</body>
