<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Date Amanhã com João</title>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Chewy', cursive;
      background: #fff;
      overflow: hidden;
    }

    #app {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 20px;
    }

    .screen {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      position: relative;
    }
    .screen.active { display: flex; }

    .brand {
      position: absolute;
      bottom: 16px;
      right: 20px;
      font-family: 'Chewy', cursive;
      font-size: 18px;
      color: #111;
      font-style: italic;
    }

    /* ---- TELAS 1 e 2 ---- */
    .question {
      font-family: 'Chewy', cursive;
      font-size: 52px;
      color: #111;
      text-align: center;
      line-height: 1.2;
      margin-bottom: 60px;
      max-width: 700px;
    }

    .buttons-row {
      display: flex;
      gap: 40px;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 700px;
    }

    .btn-yes {
      background: #1DB954;
      color: #111;
      border: none;
      border-radius: 50px;
      font-family: 'Chewy', cursive;
      font-size: 26px;
      padding: 24px 70px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: transform 0.1s;
      flex-shrink: 0;
      min-width: 220px;
    }
    .btn-yes:hover { transform: scale(1.05); }
    .btn-yes:active { transform: scale(0.97); }

    .btn-no {
      background: #FF4C3B;
      color: #111;
      border: none;
      border-radius: 50px;
      font-family: 'Chewy', cursive;
      font-size: 26px;
      padding: 24px 70px;
      cursor: pointer;
      flex-shrink: 0;
      min-width: 220px;
    }

    /* Botão fugitivo — fixo na viewport */
    .btn-no-runaway {
      position: fixed;
      z-index: 999;
      transition: left 0.18s ease, top 0.18s ease;
    }

    /* ---- TELA 3: ROLETA ---- */
    .wheel-title {
      font-family: 'Chewy', cursive;
      font-size: 34px;
      color: #111;
      text-align: center;
      margin-bottom: 24px;
    }

    .wheel-layout {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
      width: 100%;
    }

    .wheel-container {
      position: relative;
      width: 260px;
      height: 260px;
      flex-shrink: 0;
    }

    .pin {
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 24px solid #1a5276;
      z-index: 10;
    }

    .wheel-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 32px;
      height: 32px;
      background: #f5f5dc;
      border-radius: 50%;
      border: 3px solid #aaa;
      z-index: 5;
    }

    .wheel-btns {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .btn-select {
      background: #1DB954;
      color: #111;
      border: none;
      border-radius: 40px;
      font-family: 'Chewy', cursive;
      font-size: 22px;
      padding: 18px 40px;
      cursor: pointer;
      transition: transform 0.1s;
      min-width: 200px;
      text-align: center;
    }
    .btn-select:hover { transform: scale(1.04); }

    .btn-teal {
      background: #17A589;
      color: #fff;
      border: none;
      border-radius: 40px;
      font-family: 'Chewy', cursive;
      font-size: 20px;
      padding: 16px 32px;
      cursor: pointer;
      transition: transform 0.1s;
      min-width: 200px;
      text-align: center;
    }
    .btn-teal:hover { transform: scale(1.04); }

    .result-label {
      font-family: 'Chewy', cursive;
      font-size: 20px;
      color: #E8821B;
      text-align: center;
      margin-top: 12px;
      min-height: 28px;
    }

    .manual-picker {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }
    .manual-picker.show { display: flex; }
    .manual-picker select {
      font-family: 'Chewy', cursive;
      font-size: 18px;
      padding: 10px 20px;
      border-radius: 30px;
      border: 2px solid #17A589;
      outline: none;
      color: #111;
    }
    .manual-picker button {
      background: #17A589;
      color: #fff;
      border: none;
      border-radius: 30px;
      font-family: 'Chewy', cursive;
      font-size: 18px;
      padding: 12px 36px;
      cursor: pointer;
    }

    /* ---- TELA 4 ---- */
    .confirm-text {
      font-family: 'Chewy', cursive;
      font-size: 42px;
      color: #111;
      text-align: center;
      line-height: 1.4;
      max-width: 680px;
    }

    .emoji-item {
      position: absolute;
      font-size: 52px;
      animation: floatEmoji 3s ease-in-out infinite;
    }
    @keyframes floatEmoji {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* Partículas de explosão */
    .particle {
      position: fixed;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      pointer-events: none;
      animation: explode 0.6s ease-out forwards;
    }
    @keyframes explode {
      0% { transform: scale(1) translate(0,0); opacity: 1; }
      100% { transform: scale(0) translate(var(--tx), var(--ty)); opacity: 0; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- ===================== TELA 1 ===================== -->
  <div id="screen1" class="screen active">
    <p class="question">Você vai para o date amanhã com João?</p>
    <div class="buttons-row">
      <button class="btn-yes" onclick="goToScreen2()">CLARO!</button>
      <!-- Botão "Não." original (fica escondido depois que o clone é criado) -->
      <button class="btn-no" id="btnNo1" onmouseenter="runAway()" onclick="runAway()">Não.</button>
    </div>
    <span class="brand">Santola Corp.</span>
  </div>

  <!-- ===================== TELA 2 ===================== -->
  <div id="screen2" class="screen">
    <p class="question" style="font-size:60px">Está empolgada?</p>
    <div class="buttons-row">
      <button class="btn-yes" onclick="goToScreen3()">MUITO!</button>
      <button class="btn-no" id="btnNo2" onclick="explodeBtn(this)">Não.</button>
    </div>
    <span class="brand">Santola Corp.</span>
  </div>

  <!-- ===================== TELA 3: ROLETA ===================== -->
  <div id="screen3" class="screen">
    <p class="wheel-title">Escolher local:</p>
    <div class="wheel-layout">

      <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
        <div class="wheel-container">
          <div class="pin"></div>
          <canvas id="wheelCanvas" width="260" height="260"></canvas>
          <div class="wheel-center"></div>
        </div>
        <div class="result-label" id="resultLabel">— gire a roleta! —</div>
        <button class="btn-select" id="btnSelectar" onclick="selectRestaurant()"
          style="opacity:0.4;cursor:not-allowed;margin-top:8px">Selecionar</button>
      </div>

      <div class="wheel-btns">
        <button class="btn-teal" onclick="spinWheel()">Roletar novamente</button>
        <button class="btn-teal" onclick="toggleManual()">Escolher na mão</button>
        <div class="manual-picker" id="manualPicker">
          <select id="manualSelect"></select>
          <button onclick="chooseManual()">Confirmar</button>
        </div>
      </div>

    </div>
    <span class="brand">Santola Corp.</span>
  </div>

  <!-- ===================== TELA 4 ===================== -->
  <div id="screen4" class="screen">
    <span class="emoji-item" style="top:6%;left:4%;animation-delay:0s">😍</span>
    <span class="emoji-item" style="top:6%;right:4%;animation-delay:0.5s">🥰</span>
    <span class="emoji-item" style="top:40%;left:4%;animation-delay:1s">😘</span>
    <span class="emoji-item" style="top:40%;right:4%;animation-delay:1.5s">😊</span>
    <span class="emoji-item" style="bottom:12%;left:6%;animation-delay:0.8s">💐</span>
    <p class="confirm-text">
      Confirmado então:<br>
      Amanhã às 19 horas.<br>
      No <span id="chosenRestaurant" style="color:#E8821B"></span><br><br>
      Te espero lá Teté ❤️
    </p>
    <span class="brand">Santola Corp.</span>
  </div>

</div>

<script>
  /* ============================================================
     CONFIGURAÇÕES — edite aqui facilmente
  ============================================================ */

  // Nome da pessoa convidada (aparece na tela 4)
  const NOME = "Teté";

  // Horário do date
  const HORARIO = "19 horas";

  // Lista de restaurantes para a roleta
  const restaurants = [
    "Açougue",
    "Al Mare",
    "Purgatorio",
    "Lotti",
    "Cantina Volpi",
    "33 Contemporâneo",
    "Ori",
    "Casa Iryna",
    "Amado",
    "GAttai",
    "Alfedo"
  ];

  /* ============================================================
     ROLETA
  ============================================================ */
  const colors = [
    "#F4A340","#3CB371","#1E90FF","#9B59B6","#E74C3C",
    "#27AE60","#F39C12","#2ECC71","#E67E22","#16A085","#8E44AD"
  ];

  let currentRestaurant = null;
  let isSpinning = false;
  let currentAngle = 0;

  function drawWheel(angle) {
    const canvas = document.getElementById('wheelCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const cx = 130, cy = 130, r = 122;
    const n = restaurants.length;
    const slice = (2 * Math.PI) / n;
    ctx.clearRect(0, 0, 260, 260);

    for (let i = 0; i < n; i++) {
      const start = angle + i * slice;
      const end = start + slice;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, start, end);
      ctx.closePath();
      ctx.fillStyle = colors[i % colors.length];
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(start + slice / 2);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 11px Chewy, cursive';
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = 2;
      ctx.fillText(restaurants[i], r - 10, 4);
      ctx.restore();
    }

    // borda laranja
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, 2 * Math.PI);
    ctx.strokeStyle = '#E8821B';
    ctx.lineWidth = 7;
    ctx.stroke();

    // bolinhas decorativas
    for (let i = 0; i < n; i++) {
      const a = angle + i * slice + slice / 2;
      const bx = cx + (r - 16) * Math.cos(a);
      const by = cy + (r - 16) * Math.sin(a);
      ctx.beginPath();
      ctx.arc(bx, by, 6, 0, 2 * Math.PI);
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fill();
    }
  }

  drawWheel(0);

  // Preenche o select manual
  const sel = document.getElementById('manualSelect');
  restaurants.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r;
    opt.textContent = r;
    sel.appendChild(opt);
  });

  function spinWheel() {
    if (isSpinning) return;
    isSpinning = true;
    document.getElementById('resultLabel').textContent = '— girando... —';
    const btnS = document.getElementById('btnSelectar');
    btnS.style.opacity = '0.4';
    btnS.style.cursor = 'not-allowed';

    const spins = 5 + Math.random() * 5;
    const extra = Math.random() * 2 * Math.PI;
    const totalRotation = spins * 2 * Math.PI + extra;
    const duration = 4000;
    const start = performance.now();
    const startAngle = currentAngle;

    function animate(now) {
      const elapsed = now - start;
      const t = Math.min(elapsed / duration, 1);
      const ease = 1 - Math.pow(1 - t, 4);
      currentAngle = startAngle + totalRotation * ease;
      drawWheel(currentAngle);
      if (t < 1) {
        requestAnimationFrame(animate);
      } else {
        isSpinning = false;
        const n = restaurants.length;
        const slice = (2 * Math.PI) / n;
        const norm = (((-currentAngle - Math.PI / 2) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
        const idx = Math.floor(norm / slice) % n;
        currentRestaurant = restaurants[idx];
        document.getElementById('resultLabel').textContent = '🍽️ ' + currentRestaurant;
        btnS.style.opacity = '1';
        btnS.style.cursor = 'pointer';
      }
    }
    requestAnimationFrame(animate);
  }

  function selectRestaurant() { if (currentRestaurant) showConfirm(currentRestaurant); }
  function toggleManual() { document.getElementById('manualPicker').classList.toggle('show'); }
  function chooseManual() { showConfirm(document.getElementById('manualSelect').value); }

  function showConfirm(restaurant) {
    document.getElementById('chosenRestaurant').textContent = restaurant;
    goToScreen(4);
  }

  /* ============================================================
     NAVEGAÇÃO
  ============================================================ */
  function goToScreen(n) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen' + n).classList.add('active');
  }

  function goToScreen3() { goToScreen(3); }

  /* ============================================================
     BOTÃO FUGINDO — tela 1
  ============================================================ */
  let runawayBtn = null;

  function initRunawayBtn() {
    if (runawayBtn) return;
    const original = document.getElementById('btnNo1');
    const rect = original.getBoundingClientRect();

    runawayBtn = document.createElement('button');
    runawayBtn.className = 'btn-no btn-no-runaway';
    runawayBtn.textContent = 'Não.';
    runawayBtn.style.left = rect.left + 'px';
    runawayBtn.style.top = rect.top + 'px';
    runawayBtn.style.width = rect.width + 'px';
    runawayBtn.style.height = rect.height + 'px';
    runawayBtn.addEventListener('mouseenter', runAway);
    runawayBtn.addEventListener('click', runAway);
    document.body.appendChild(runawayBtn);
    original.style.visibility = 'hidden';
  }

  function runAway() {
    initRunawayBtn();
    const bw = runawayBtn.offsetWidth;
    const bh = runawayBtn.offsetHeight;
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const nx = Math.random() * (vw - bw - 10) + 5;
    const ny = Math.random() * (vh - bh - 10) + 5;
    runawayBtn.style.left = nx + 'px';
    runawayBtn.style.top = ny + 'px';
  }

  function cleanRunaway() {
    if (runawayBtn) { runawayBtn.remove(); runawayBtn = null; }
    const original = document.getElementById('btnNo1');
    if (original) original.style.visibility = 'visible';
  }

  function goToScreen2() {
    cleanRunaway();
    goToScreen(2);
  }

  /* ============================================================
     BOTÃO EXPLODINDO — tela 2
  ============================================================ */
  function explodeBtn(btn) {
    const rect = btn.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    for (let i = 0; i < 18; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const angle = (i / 18) * 360;
      const dist = 50 + Math.random() * 60;
      const tx = Math.cos(angle * Math.PI / 180) * dist + 'px';
      const ty = Math.sin(angle * Math.PI / 180) * dist + 'px';
      p.style.cssText = `left:${cx}px;top:${cy}px;background:${['#FF4C3B','#FF8C00','#FFD700','#FF69B4'][i%4]};--tx:${tx};--ty:${ty};`;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 700);
    }
    btn.style.transition = 'transform 0.3s, opacity 0.3s';
    btn.style.transform = 'scale(2)';
    btn.style.opacity = '0';
    setTimeout(() => btn.remove(), 350);
  }
</script>
</body>
</html>
